# =============================================================================
# Toolchain
# =============================================================================
# AGP 7.4.2 requires Java 11+, and Gradle 7.6.6 can run on at most Java 19.
# JDK 17 is the common supported version.  Android Studio's Gradle JDK is the
# registered "temurin-17" entry (same installation as below); this property is
# used by the command line and by the Gradle daemon.
org.gradle.java.home=D:\\java-se-17\\jdk-17.0.20.1+1

# The decompiled tree is large and packaging 7 dex / ~193 MB needs headroom.
# 1 GB was enough for cached builds but OOM'd when D8 had to repackage after a
# class was patched, so use a larger heap.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true

# =============================================================================
# Android
# =============================================================================
android.useAndroidX=true
android.enableJetifier=false

# Keep R fields compile-time constants and generate one R class per package:
# the decompiled library bytecode refers to androidx.*.R constants directly.
android.nonFinalResIds=false
android.nonTransitiveRClass=false

# The app ships its own decompiled BuildConfig and data-binding code, so AGP
# must not generate conflicting classes.  The same flags are set in build.gradle.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
